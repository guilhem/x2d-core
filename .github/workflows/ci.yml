name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            compiler: g++
            build_type: Release
            flags: ''
          - name: Clang Debug ASan UBSan
            compiler: clang++
            build_type: Debug
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure and validate version
        env:
          CXX: ${{ matrix.compiler }}
          BUILD_TYPE: ${{ matrix.build_type }}
          CXX_FLAGS: ${{ matrix.flags }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          cmake -S . -B build \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_CXX_FLAGS="$CXX_FLAGS" \
            -DX2D_RELEASE_TAG="$RELEASE_TAG"
      - name: Build checks and MySensors server
        run: cmake --build build --parallel 2
      - name: Run checks
        run: ctest --test-dir build --output-on-failure --stop-on-failure --timeout 120
